[pytest]
filterwarnings = ignore::DeprecationWarning
addopts = --strict-markers
markers = 
    sanity: marker for sanity test cases
    performance: marker for performance test cases
    module: marker for test cases on module
    aosp: marker for test cases on AOSP
    ironman: marker for test cases on H4
    bluetooth: marker for bluetooth test cases
    wifi: marker for wifi test cases
    coex: marker for coex test cases
    call: marker for voice calling test cases
    ota: marker for OTA test cases
    dev: marker for temperary test
